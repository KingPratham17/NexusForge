server.port=8080
spring.application.name=sap-adapter-generator

# Workspaces directory for temporary generated projects
adapter.generator.workspaces-dir=C:/Users/pratham.wadeiyar/.gemini/antigravity-ide/scratch/build-workspaces

# AI LLM Provider Configuration
# Supported providers: anthropic, gemini, openai
ai.llm.enabled=true
ai.llm.provider=${AI_LLM_PROVIDER:anthropic}
ai.llm.base-url=${ANTHROPIC_BASE_URL:http://localhost:20128}
ai.llm.auth-token=${ANTHROPIC_AUTH_TOKEN:1c8edc04-8e61-4699-bafc-fc116745c2a1}
ai.llm.api-key=${ANTHROPIC_API_KEY:${GEMINI_API_KEY:}}
ai.llm.model=${ANTHROPIC_MODEL:Pratham}

# CORS configuration
management.endpoints.web.exposure.include=*
logging.level.com.sap.adapter.generator=INFO

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nexusforge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

